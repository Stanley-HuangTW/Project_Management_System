services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hrapp_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrapp} -d ${POSTGRES_DB:-hrapp_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # connection_limit is per Prisma Client instance, and the clustered
      # server (server.js) runs one instance per worker process — capped
      # here so a handful of workers can't collectively exceed Postgres's
      # own max_connections under load.
      DATABASE_URL: postgresql://${POSTGRES_USER:-hrapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrapp_db}?schema=public&connection_limit=10
    #ports:
    #  - "3000:3000"
    #  原始設定
    expose:
      - "3000"
    # 行程活著、連得到資料庫才算健康(/api/health,不用登入)。`docker ps` 會看到 healthy / unhealthy;
    # start_period 留給啟動時的 prisma migrate deploy 與 Next.js 編譯載入。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - uploads_data:/app/public/uploads
      # 週報落在專案資料夾底下,直接用檔案總管打得開。不放 public/uploads:
      # 那個目錄對外服務,週報裡有預算與人力。
      - ./weekly-reports:/app/weekly-reports
      # 跟 scripts/backup-db.sh 寫入的是同一個資料夾——不管是那支腳本排程
      # 產生的、還是系統設定裡新的備份功能產生的,都在同一份清單裡看得到。
      - ./backups:/app/backups
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
