stages:
  - deploy

auto-deploy:
  stage: deploy
  tags:
    - Auto Deploy Project Management System
  only:
    - main  # 僅在 main 分支有更新時觸發 (若您是用 master 請改為 master)
  script:
    - cd /home/projectadmin/apps/ursrobot_project
    - git pull origin main
    - docker compose down
    - docker compose --env-file .env.production up -d db
    - docker compose --env-file .env.production build app
    - docker compose --env-file .env.production up -d app
    - docker compose up -d proxy 
